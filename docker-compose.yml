services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow"
      Jwt__Key: "docker-compose-dev-key-change-me-32-chars-minimum"
      Jwt__Issuer: "TaskFlow"
      Jwt__Audience: "TaskFlowClients"

volumes:
  pgdata:
